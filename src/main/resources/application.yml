server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: projects-knowledge

projects-knowledge:
  desktop:
    enabled: false
  storage:
    persistent-cache-enabled: true
  codex:
    enabled: true
    command: ${CODEX_COMMAND:codex.exe}
    # Leave CODEX_MODEL empty to use the highest model exposed by the installed Codex runtime.
    model: ${CODEX_MODEL:}
    reasoning-effort: ${CODEX_REASONING_EFFORT:medium}
    timeout-seconds: 300
    model-cache-seconds: 18000
    project-cache-seconds: 86400
    answer-cache-seconds: 86400
    integration-cache-seconds: 86400
    overview-cache-seconds: 86400
    overview-cache-max-entries: 50
    answer-cache-max-entries: 100
  scan:
    max-file-bytes: 1000000
    file-cache-seconds: 30
