server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: projects-knowledge

projects-knowledge:
  desktop:
    enabled: false
  storage:
    persistent-cache-enabled: true
  codex:
    enabled: true
    command: ${CODEX_COMMAND:codex.exe}
    timeout-seconds: 300
    project-cache-seconds: 3600
    answer-cache-seconds: 18000
    integration-cache-seconds: 18000
    overview-cache-seconds: 18000
    overview-cache-max-entries: 50
    answer-cache-max-entries: 100
  scan:
    max-file-bytes: 1000000
    file-cache-seconds: 30
